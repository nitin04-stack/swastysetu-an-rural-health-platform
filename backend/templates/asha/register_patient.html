
{% extends "shared/base.html" %}
{% block title %}Register Patient{% endblock %}
{% block content %}
<div class="page-title">Register New Patient</div>
<div class="page-subtitle">Create patient record and assign priority category.</div>

<div class="card">
  <form method="POST">
    <label>Full Name *</label>
    <input type="text" name="name" required>

    <div style="display: flex; gap: 15px;">
      <div style="flex: 1;">
        <label>Age</label>
        <input type="number" name="age" min="0" max="120">
      </div>
      <div style="flex: 1;">
        <label>Gender</label>
        <select name="gender">
          <option value="">-- select --</option>
          <option value="Female">Female</option>
          <option value="Male">Male</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>

    <!-- बदलाव: Category selection -->
    <label>Priority Category</label>
    <select name="category" required style="border: 2px solid var(--moderate);">
      <option value="general">General Patient</option>
      <option value="pregnant">Pregnant Woman (MCH)</option>
      <option value="infant">Infant/Child (Under 5)</option>
      <option value="chronic">Chronic Patient (BP/Heart/Sugar)</option>
    </select>

    <label>Phone Number (optional)</label>
    <input type="tel" name="phone" placeholder="10-digit phone number">

    <label>Address</label>
    <textarea name="address" placeholder="Village, block, district"></textarea>

    <button type="submit" class="btn btn-block">Register & Continue to Check-up</button>
  </form>
</div>
{% endblock %}
